name: Build automation workflow

on:
  # triggers the workflow, when a PR exists that has target branch 'main'
  pull_request:
    branches:
    - main
  # trigger that allows for manually starting the workflow
  workflow_dispatch:
permissions:
  contents: read
  packages: write


jobs:

  build-container-image:
    name: container-automation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          # Passe context/file ggf. an deine Ordnerstruktur an
          - name: ticket-backend
            context: .
            # nutzt default "Dockerfile"
            file: Dockerfile
          - name: ticket-frontend
            context: .
            file: ./frontend.Dockerfile
    env:
      IMAGE_OWNER: developer-akademie-devsecopskurs


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files for debugging
        run: |
          echo "DEBUGGING OUTPUT: Root directory"
          ls -al
          echo "DEBUGGING OUTPUT: .github/workflows directory"
          ls -al .github/workflows
          echo "DEBUGGING OUTPUT: Backend directory"
          ls -al backend
          echo "DEBUGGING OUTPUT: Frontend Dockerfile (if exists)"
          if [ -f frontend.Dockerfile ]; then cat frontend.Dockerfile; else echo "frontend.Dockerfile not found"; fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        if: false
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sample-full-stack-monorepo/ticket-backend:latest

      
      - name: Build and push frontend image
        if: false
        uses: docker/build-push-action@v6
        with:
          file: frontend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sample-full-stack-monorepo/ticket-frontend:latest

      ## New build with matrix
      - name: Build & push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        env:
          IMAGE_OWNER: developer-akademie-devsecopskurs
          IMAGE_REPO: ghcr.io/${{ env.IMAGE_OWNER }}/sample-full-stack-monorepo
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file || 'Dockerfile' }}
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ghcr.io/developer-akademie-devsecopskurs/sample-full-stack-monorepo/ticket-backend:latest
          tags: |
            ${{ env.IMAGE_REPO }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}/${{ matrix.service.name }}:latest