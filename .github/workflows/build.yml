name: Build automation workflow

on:
  # triggers the workflow, when a PR exists that has target branch 'main'
  pull_request:
    branches:
    - main
  # trigger that allows for manually starting the workflow
  workflow_dispatch:

jobs:

  build-container-image:
    name: container-automation
    runs-on: ubuntu-latest
    
    steps:
      - name: dummy step
        run: |
          echo "hello from pipeline"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        env:
          IMAGE_OWNER: developer-akademie-devsecopskurs
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sample-full-stack-monorepo:latest
